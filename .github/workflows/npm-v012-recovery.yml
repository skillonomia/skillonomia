name: npm-v0.1.2-recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v0.1.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: npm ci
      - name: Pack exact approved tag and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_OTP: ${{ secrets.NPM_OTP }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          test -n "$NPM_OTP"
          TARBALL=$(npm pack --silent | tail -1)
          echo "932a64f313feccc7c2f348a43c9eb6d6f024800522da9f0ed022c4c41d3df269  $TARBALL" | sha256sum -c -
          npm publish "$TARBALL" --access public --otp="$NPM_OTP"
          npm view @skillonomia/cli@0.1.2 dist.integrity version --json
          node ci/mvp-release.mjs npm --package @skillonomia/cli@0.1.2
