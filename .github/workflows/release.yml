name: release
on:
  push:
    tags:
      - "v*.*.*"

defaults:
  run:
    shell: bash

# ------------------------------------------------------- the one publishing file
#
# THE ONLY WORKFLOW IN THIS REPOSITORY THAT PUBLISHES. It runs on a NEW version
# tag and on nothing else — not on a push to a branch, not on a schedule, not on
# a manual dispatch — because pushing a version tag is the act that carries the
# owner's decision to release, and CI must not be able to manufacture that
# decision for itself. The `release` environment is the second half of the same
# gate: it holds the job until the owner approves the deployment.
#
# `v0.1.0` IS REFUSED BY NAME. It is the source-only baseline: it was published
# with source and a git bundle and no binary, and a published release is a thing
# people have already downloaded and checksummed. Adding an asset to it later
# would silently change what "v0.1.0" means for everyone who reads that page
# afterwards. A new artifact needs a new version.
#
# The tag must also match `package.json`, so a release cannot carry a version
# its own manifest disagrees with, and the release is refused if it already
# exists — this workflow creates, it never amends.
#
# `test/source-only.test.ts` checks these three refusals against this file — and
# then RUNS the step below against this checkout's `package.json`, because three
# refusals with no accepting case is a gate that publishes nothing. It shipped
# that way: the rules landed while `package.json` still said `0.1.0`, so the
# baseline refusal and the version check together left no tag that could be
# pushed, and every text-level assertion stayed green.

permissions:
  contents: write

env:
  # The one image reference this project publishes. `candidate.yml` builds it
  # without a registry and this file is the only place it is pushed;
  # `test/published-image-contract.test.ts` requires the documents to name the
  # same string, so a reader's `docker pull` and CI's push cannot drift apart.
  IMAGE: ghcr.io/skillonomia/skillonomia

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-binary:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      # THE FIRST THING THIS WORKFLOW DOES, AND IT PUBLISHES NOTHING.
      #
      # `v0.1.3` published its binary, published its image, and then the npm
      # registry refused the manifest:
      #
      #     npm error code E422
      #     Error verifying sigstore provenance bundle: Failed to validate
      #     repository information: package.json: "repository.url" is "",
      #     expected to match "https://github.com/skillonomia/skillonomia"
      #     from provenance
      #
      # The signing had worked. What was missing was a `repository` field, and
      # the field is a precondition of the publish — a fact about THIS TREE that
      # was true or false before the tag was pushed and that nothing asked
      # until the registry asked, by which time two artifacts were out and a
      # version was spent. Every check this repository had read a PUBLISHED
      # artifact, so none of them could run before the release existed.
      #
      # `preflight` asks all of it here: the manifest's repository resolves to
      # the repository the provenance will name, the version and the tag are one
      # release, the registry does not already serve this version, no release
      # carries this tag, `npm pack` succeeds and THE TARBALL it produced carries
      # the same repository and version, and the tag is a lightweight tag of this
      # commit. It runs before `gh release create`, before the image build and
      # before the publish, so a release that cannot finish fails in the first
      # seconds instead of after two thirds of it is irreversible.
      #
      # THE MARKER IS GREPPED, not merely awaited. `preflight` prints
      # `RELEASE_PREFLIGHT_STAGED_OK` when something could not be asked — a
      # missing tag object, for instance — and a staged run is not the run this
      # step is here to demand.
      #
      # The two steps below stay. They overlap this one on purpose: they are
      # what `test/source-only.test.ts` and `test/version.test.ts` read the
      # release rules out of, and a gate that moved into a script would leave
      # those guards reading a file that no longer refuses anything.
      #
      # The record and the log go to `RUNNER_TEMP`: this job packages the
      # release asset out of this checkout two steps later, and a check that
      # left files in the tree it is checking would be changing what it packs.
      - name: Preflight — everything the registries will ask, asked before anything is published
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node ci/mvp-release.mjs preflight --tag "${GITHUB_REF_NAME}" \
            --record "${RUNNER_TEMP}/preflight.json" | tee "${RUNNER_TEMP}/preflight.log"
          grep -qx 'RELEASE_PREFLIGHT_OK' "${RUNNER_TEMP}/preflight.log"

      - name: The tag is a new version, and not the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "v0.1.0" ]; then
            echo "::error::v0.1.0 is the source-only baseline release. It is never re-published and never gains an asset; publish a new version instead."
            exit 1
          fi
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json ($VERSION) — the tag must point at the approved candidate commit"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists — this workflow creates releases, it does not amend them"
            exit 1
          fi

      # THE TAG RESOLVES TO THE COMMIT THIS RUN PUBLISHES, AND NOT TO AN OBJECT
      # IN FRONT OF IT. The image below is built from a git context at this ref,
      # and BuildKit records in the provenance the sha THAT REF RESOLVES TO;
      # npm's trusted publish records `GITHUB_SHA`. For a lightweight tag those
      # are one commit and the two provenances agree. For an ANNOTATED tag the
      # ref resolves to the TAG OBJECT, which is a different sha — and
      # `ci/mvp-release.mjs hardening` then reads two different commits out of
      # two genuine provenances and refuses the pair as "artifacts of two
      # different releases", AFTER both have been published and cannot be
      # unpublished. So the disagreement is settled here, where the only cost is
      # a re-tag, rather than at the gate, where the cost is a burnt version.
      - name: The tag resolves to the commit this run publishes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha')
          KIND="${OBJECT%% *}"
          SHA="${OBJECT##* }"
          if [ "$SHA" != "${GITHUB_SHA}" ]; then
            echo "::error::refs/tags/$TAG resolves to the $KIND $SHA, and this run is publishing ${GITHUB_SHA}. The image's provenance records what the ref resolves to and npm's records the commit, so both artifacts would be published and then refused as different releases. Re-tag this commit with a lightweight tag: \`git tag -d $TAG && git tag $TAG ${GITHUB_SHA} && git push --force origin $TAG\`."
            exit 1
          fi
          echo "refs/tags/$TAG -> $KIND $SHA"

      # The same packaging the candidate stage ran, on the commit the tag points
      # at. `build:binary` is byte-reproducible (the `supply-chain` job in
      # `ci.yml` proves it on every push), so this produces the reviewed bytes.
      - name: Package and smoke the release asset
        run: node ci/mvp-release.mjs binary --local

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Linux x86_64 release binary. Verify with \`sha256sum -c SHA256SUMS\` before running." \
            dist/release/skillonomia-linux-x86_64.tar.gz \
            dist/release/SHA256SUMS

      # THE READ-BACK. What was just published is downloaded again from the
      # release, checksummed against the published `SHA256SUMS`, unpacked outside
      # this checkout and run. Until this step prints `RELEASE_BINARY_OK`, the
      # release is a file upload and not a verified artifact.
      - name: Download the published assets and smoke them
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -rf dist/release
          node ci/mvp-release.mjs binary --tag "${GITHUB_REF_NAME}"

  # --------------------------------------------------------- the image (B1)
  #
  # THE GHCR PUSH, AND NOTHING BEFORE IT. This job runs only after
  # `publish-binary` has published and read back the release, and only out of
  # the `release` environment — the same owner approval, taken again for a
  # second artifact. Nothing in `candidate.yml` can reach a registry; this is
  # the one place a push exists.
  #
  # WHAT IS PUBLISHED IS A DIGEST. The tag `:<version>` is written too, because
  # a human needs a name to read, but the artifact of record is the digest
  # buildx reports and the read-back below re-resolves it from the registry: a
  # tag can be moved afterwards and a digest cannot.
  #
  # ------------------------------------------------------------------ (D)
  #
  # AND THE DIGEST NOW CARRIES ITS OWN EVIDENCE. Three things are attached to
  # the push, and each one answers a question a digest alone cannot:
  #
  #   --sbom=true      WHAT IS IN IT. One SPDX document per platform, attached
  #                    to that platform's manifest, so an operator reading a CVE
  #                    advisory can answer "is that package in the thing we run"
  #                    from the registry instead of from a rebuild.
  #   --provenance     WHO BUILT IT, AND FROM WHAT. buildx attaches provenance by
  #     mode=max       default in `mode=min`, and a min-mode statement has an
  #                    EMPTY `builder.id`: it says a build happened and not whose.
  #                    `builder-id` is set to THIS RUN's URL, so the provenance
  #                    names a run of this repository that a reader can open.
  #   cosign sign      THAT WE MEANT TO PUBLISH IT. Keyless: the signing identity
  #                    is this workflow's OIDC token, certified by Fulcio for the
  #                    few minutes the job holds it, and logged in Rekor. There is
  #                    no long-lived signing key to leak, rotate or steal, and the
  #                    identity a verifier pins is `release.yml on a tag of this
  #                    repository` — a signature from any other workflow, branch
  #                    or repository fails verification instead of passing quietly.
  #
  # `ci/mvp-release.mjs hardening` reads all three back OUT OF THE REGISTRY
  # before a deploy, and the last job of this workflow runs it against exactly
  # what was published here.
  publish-image:
    needs: publish-binary
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      # the keyless signing identity: a token minted for this job, and nothing stored
      id-token: write
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: npm ci --ignore-scripts

      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      # THE CONTEXT IS THE TAG, FETCHED — NOT THIS CHECKOUT. `docker buildx build
      # … .` sends a LOCAL DIRECTORY, and a local directory has no name a build
      # can record: BuildKit writes `configSource: {"path": "Dockerfile"}` and
      # the provenance then says which Dockerfile was used and NOTHING about the
      # repository, the ref or the commit it came from. Those three fields are
      # exactly what the gate reads, so `--provenance=mode=max` over a local
      # context produces a provenance the gate refuses — "it was built by (no
      # repository)", "the ref is (not recorded)", "it does not record the commit
      # it was built from" — on a real release, after the push, with the version
      # already spent. `builder-id` does not save it: that names the run and the
      # gate demands the source as well.
      #
      # A GIT CONTEXT is a source a build can record. BuildKit resolves the ref
      # itself and writes the URL and the sha it resolved into
      # `externalParameters.configSource` and into `resolvedDependencies` — the
      # two places `provenanceIdentity()` reads — so the provenance names
      # `https://github.com/<owner>/<repo>`, `refs/tags/v<version>` and the
      # commit. The tree that is built is the tag's, which is the tree the
      # candidate stage reviewed; the checkout above stays for the steps that
      # read `package.json` and write `metadata.json`, not for the build.
      #
      # `GIT_AUTH_TOKEN` is what BuildKit fetches that context with. It is this
      # run's own token — the build does not depend on the repository being
      # readable without one.
      - name: Build both architectures with an SBOM and attributable provenance, and push them
        id: push
        env:
          GIT_AUTH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE}:${VERSION}" \
            --sbom=true \
            --provenance="mode=max,builder-id=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --secret id=GIT_AUTH_TOKEN,env=GIT_AUTH_TOKEN \
            --metadata-file metadata.json \
            --push "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git#${GITHUB_REF}"
          DIGEST=$(node -p "require('./metadata.json')['containerimage.digest']")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # THE SIGNATURE, AND THEN THE VERIFICATION OF IT. `cosign sign` writes an
      # artifact to the registry; that it wrote one is not the claim anybody
      # cares about. The claim is that a verifier pinning THIS identity accepts
      # it, so the same command an operator will run is run here, against the
      # digest that was just pushed, before the release goes any further.
      - name: Sign the published digest, keyless
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"

      - name: Verify the signature that was just written
        run: |
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/" \
            "${{ steps.push.outputs.ref }}"

      # THE READ-BACK. The manifest is re-resolved FROM THE REGISTRY, then the
      # image is pulled by digest, run loopback-only, driven through the
      # quickstart to a terminal `adopted` receipt, restarted on the same volume
      # and the receipt is read back. Until `GHCR_SMOKE_OK` is printed, this is
      # an upload and not a verified artifact.
      - name: Resolve the published manifest and smoke it
        run: |
          docker buildx imagetools inspect "${{ steps.push.outputs.ref }}"
          node ci/mvp-release.mjs ghcr --digest "${{ steps.push.outputs.ref }}" --expect-host linux-x64 --record ghcr-release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghcr-release-record
          path: ghcr-release.json

  # ----------------------------------------------------------- the npm CLI (B2)
  #
  # THE NPM PUBLISH. Same environment, same owner approval, third artifact.
  #
  # ------------------------------------------------------------------ (D)
  #
  # THERE IS NO LONGER AN `NPM_TOKEN`. This job used to fail closed on a missing
  # one; it now has no publish credential at all, because a token that can
  # publish this package is a secret that exists between releases — in the
  # environment, in whatever produced it, and in the memory of anyone who ever
  # copied it — and every hour of that existence is an hour it can be stolen.
  # OIDC Trusted Publishing replaces it with a token minted for THIS JOB, valid
  # for minutes, that the registry accepts only from the repository, workflow
  # and environment the package's trusted publisher names on npmjs.com.
  #
  # THE FAIL-CLOSED RULE SURVIVES, POINTED AT WHAT CAN NOW BE ABSENT. A missing
  # secret used to be the way this job could publish nothing and say nothing;
  # the equivalent today is an OIDC token this job cannot mint — `id-token:
  # write` removed from the permissions, or the workflow renamed out of the
  # trusted publisher's configuration. That is checked before the pack, in one
  # line, and blocks the release rather than letting one go out announcing a CLI
  # nobody can install.
  #
  # AND THE PUBLISH CARRIES PROVENANCE. A trusted publish signs a SLSA statement
  # naming this repository, this workflow and this run, and npm countersigns the
  # upload. `npm audit signatures` below verifies both cryptographically, from a
  # clean install of what the registry now serves — not from what was uploaded.
  publish-npm:
    needs: publish-image
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # the release the SBOM is uploaded to, and the OIDC token that publishes
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Node 22 ships npm 10, and Trusted Publishing is npm 11.5.1 and later.
      # The version is pinned: "whatever is latest on the day of the release" is
      # not a thing a release can be re-run against a year from now.
      - run: npm install --global npm@11.19.0
      - run: npm ci

      - name: A publish needs an identity to publish as
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then
            echo "::error::this job cannot mint an OIDC token, so @skillonomia/cli cannot be published as a trusted publisher. Check that the job still declares \`permissions: id-token: write\` and that npmjs.com still names this workflow and the \`release\` environment as the package's trusted publisher. This release is blocked rather than published without its CLI."
            exit 1
          fi

      # ONE TARBALL, PACKED ONCE, PUBLISHED AS PACKED. `npm publish <file>` is
      # given the exact bytes that were just checksummed — not the working
      # directory, which `npm publish .` would re-pack into a second tarball
      # nobody checked.
      - name: Pack, checksum, publish that file, and read the registry back
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          TARBALL=$(npm pack --silent | tail -1)
          sha256sum "$TARBALL" | tee "$TARBALL.sha256"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          npm publish "$TARBALL" --access public --provenance
          npm view "@skillonomia/cli@${VERSION#v}" dist.integrity version --json
          node ci/mvp-release.mjs npm --package "@skillonomia/cli@${VERSION#v}"

      # THE SBOM OF THE TARBALL, AND WHAT TIES IT TO THE TARBALL. `npm sbom`
      # describes the tree a consumer installs — production dependencies, which
      # is what runs — and says nothing about WHICH archive it describes. The
      # tarball's SHA-512 is written into the document's root component, and it
      # is the same SHA-512 the registry serves as `dist.integrity`, so the gate
      # can refuse an SBOM that belongs to some other build of the same version.
      - name: The tarball's SBOM, bound to the tarball, published on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npm sbom --sbom-format cyclonedx --sbom-type application --omit dev > sbom.cdx.json
          node -e '
            const { createHash } = require("node:crypto");
            const fs = require("node:fs");
            // `node -e` leaves no script path in argv: argv[1] is the first argument.
            const [sbomPath, tarball] = process.argv.slice(1);
            const sbom = JSON.parse(fs.readFileSync(sbomPath, "utf8"));
            const hash = createHash("sha512").update(fs.readFileSync(tarball)).digest("hex");
            sbom.metadata.component.hashes = [{ alg: "SHA-512", content: hash }];
            fs.writeFileSync(sbomPath, `${JSON.stringify(sbom, null, 2)}\n`);
            // the purl and not the name: npm sbom fills the root component name
            // from the directory it ran in, and the gate matches on the purl
            console.log(`${sbomPath}: ${sbom.metadata.component.purl} SHA-512 ${hash}`);
          ' sbom.cdx.json "${TARBALL}"
          ASSET="skillonomia-cli-${VERSION}.cdx.json"
          mv sbom.cdx.json "$ASSET"
          sha256sum "$ASSET"
          # `v${VERSION}` and not the ref name: the gate in the first job has
          # already refused any tag the two disagree about, and reading the
          # version from one place keeps this step out of the guard that reads
          # that gate — which finds it by what it mentions, not by its name.
          gh release upload "v${VERSION}" "$ASSET"

      # THE CRYPTOGRAPHY, ON WHAT THE REGISTRY NOW SERVES. `npm audit
      # signatures` fetches the registry's signature and the Sigstore bundle for
      # an installed tree and verifies both. It runs on a clean install of the
      # PUBLISHED version, in a directory of its own, so what is verified is
      # what a user would download.
      - name: Verify the published registry signature and provenance
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          WHERE="$(mktemp -d)"
          cd "$WHERE"
          npm init -y >/dev/null
          npm install --ignore-scripts "@skillonomia/cli@${VERSION}"
          npm audit signatures

      # THE PRE-DEPLOY GATE, AGAINST WHAT THIS RUN PUBLISHED. Everything above
      # proves the commands were issued. This reads the SBOM, the signature and
      # the provenance back out of the registries, by digest, the way a deploy
      # will — and it is the same command the hosted deploy runs before it
      # starts anything. A release whose evidence is not on the registries fails
      # HERE, where a maintainer is looking, and not later on a server.
      - name: The published SBOM, signature and provenance, read back
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node ci/mvp-release.mjs hardening \
            --image "${{ needs.publish-image.outputs.ref }}" \
            --npm "@skillonomia/cli@$(node -p "require('./package.json').version")" \
            --record hardening.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-hardening-record
          path: hardening.json
